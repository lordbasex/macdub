<?xml version="1.0" encoding="UTF-8"?>
<!-- MacDub pipeline: four on-device stages. Colours follow the app's section palettes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1236"/>
      <stop offset="1" stop-color="#0B0818"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5C24BD"/><stop offset="1" stop-color="#140D3D"/></linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B81F8C"/><stop offset="1" stop-color="#380A38"/></linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A52CC"/><stop offset="1" stop-color="#0A1447"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CC4D14"/><stop offset="1" stop-color="#42120A"/></linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF528C"/><stop offset="1" stop-color="#FF8C40"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- Stage tiles: x, gradient, symbol, title, subtitle -->
  <g filter="url(#shadow)">
    <rect x="40"  y="70" width="230" height="150" rx="26" fill="url(#violet)"/>
    <rect x="335" y="70" width="230" height="150" rx="26" fill="url(#magenta)"/>
    <rect x="630" y="70" width="230" height="150" rx="26" fill="url(#azure)"/>
    <rect x="925" y="70" width="230" height="150" rx="26" fill="url(#amber)"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.08">
    <rect x="40"  y="70" width="230" height="75" rx="26"/>
    <rect x="335" y="70" width="230" height="75" rx="26"/>
    <rect x="630" y="70" width="230" height="75" rx="26"/>
    <rect x="925" y="70" width="230" height="75" rx="26"/>
  </g>

  <!-- Symbols (simple glyphs drawn by hand) -->
  <!-- 1. capture: speaker with waves -->
  <g transform="translate(155,110)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-22,-8 h10 l12,-10 v36 l-12,-10 h-10 z" fill="#FFFFFF"/>
    <path d="M10,-8 q8,8 0,16"/><path d="M18,-16 q16,16 0,32"/>
  </g>
  <!-- 2. speech: text lines -->
  <g transform="translate(450,110)" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <line x1="-26" y1="-12" x2="26" y2="-12"/><line x1="-26" y1="0" x2="14" y2="0"/><line x1="-26" y1="12" x2="22" y2="12"/>
  </g>
  <!-- 3. translation: A ⇄ 文 -->
  <g transform="translate(745,110)" fill="#FFFFFF" font-size="30" font-weight="700" text-anchor="middle">
    <text x="-20" y="11">A</text><text x="22" y="11" font-size="26">文</text>
  </g>
  <!-- 4. voice: waveform bars -->
  <g transform="translate(1040,110)" fill="#FFFFFF">
    <rect x="-30" y="-6" width="6" height="12" rx="3"/><rect x="-18" y="-14" width="6" height="28" rx="3"/><rect x="-6" y="-22" width="6" height="44" rx="3"/>
    <rect x="6" y="-14" width="6" height="28" rx="3"/><rect x="18" y="-8" width="6" height="16" rx="3"/>
  </g>

  <!-- Titles -->
  <g fill="#FFFFFF" font-size="20" font-weight="600" text-anchor="middle">
    <text x="155" y="180">App / system audio</text>
    <text x="450" y="180">Speech recognition</text>
    <text x="745" y="180">Translation</text>
    <text x="1040" y="180">System voice</text>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.65" font-size="14" text-anchor="middle">
    <text x="155" y="204">Core Audio tap / ScreenCaptureKit</text>
    <text x="450" y="204">SFSpeechRecognizer · on-device</text>
    <text x="745" y="204">Translation framework · on-device</text>
    <text x="1040" y="204">AVSpeechSynthesizer</text>
  </g>

  <!-- Arrows with what flows between the stages -->
  <g stroke="#FF7A5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M278,145 H318 M306,133 L320,145 L306,157"/>
    <path d="M573,145 H613 M601,133 L615,145 L601,157"/>
    <path d="M868,145 H908 M896,133 L910,145 L896,157"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.55" font-size="12" text-anchor="middle">
    <text x="302" y="128">audio</text>
    <text x="597" y="128">original text</text>
    <text x="892" y="128">translated text</text>
  </g>

  <!-- Footer -->
  <text x="600" y="262" fill="#FFFFFF" fill-opacity="0.75" font-size="15" text-anchor="middle">Everything runs on your Mac with Apple's frameworks — no cloud, no API keys, no virtual audio drivers, no microphone.</text>
</svg>
